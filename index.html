<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            min-width: 0;
        }

        .cover {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0;
        }

        .meta {
            flex-grow: 1;
            min-width: 0;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 32px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }

        .btn-small {
            font-size: 24px;
        }

        .btn.active {
            color: #ff48ff;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #aaa;
        }

        .volume-icon {
            font-size: 20px;
            min-width: 24px;
            text-align: center;
        }

        .volume-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 4px;
        }

        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }

        .playlist li {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }

        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }

        .track-name {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #ff5555;
        }
        
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: #222;
            color: #aaa;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- Блок трека -->
        <div class="track-info">
            <div class="cover">♫</div>
            <div class="meta">
                <p class="title" id="title">Загрузка...</p>
                <p class="author">Musicspot</p>
            </div>
        </div>

        <!-- Скрытый аудио-движок -->
        <audio id="audio-core"></audio>

        <!-- Прогресс -->
        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <!-- Громкость -->
        <div class="volume-container">
            <span class="volume-icon" id="volume-icon">🔊</span>
            <input type="range" class="volume-bar" id="volume-control" value="100" min="0" max="100">
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn btn-small" id="shuffle-btn" title="Случайное воспроизведение">🔀</button>
            <button class="btn" id="prev-btn" title="Предыдущий">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;" title="Плей/Пауза">▶</button>
            <button class="btn" id="next-btn" title="Следующий">⏭</button>
            <button class="btn btn-small" id="repeat-btn" title="Повторять">🔁</button>
        </div>

        <!-- Кнопка обратного порядка -->
        <div class="controls" style="margin-bottom: 16px;">
            <button class="btn btn-small" id="reverse-btn" title="Обратный порядок">🔄</button>
        </div>

        <!-- Очередь -->
        <div class="playlist-title">Очередь воспроизведения</div>
        <ul class="playlist" id="track-list">
            <li class="loading">Загрузка треков...</li>
        </ul>
    </div>

    <div class="debug-info" id="debug-info"></div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Получаем user_id
        let userId = null;
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }
        
        if (!userId) {
            const urlParams = new URLSearchParams(window.location.search);
            userId = urlParams.get('user_id');
        }
        
        if (!userId) {
            userId = localStorage.getItem('telegram_user_id');
        }
        
        if (userId) {
            localStorage.setItem('telegram_user_id', userId);
        }
        
        // ВАЖНО: Укажите ваш актуальный URL здесь
        const API_URL = 'https://earned-editorials-wait-bye.trycloudflare.com';
        
        const audioCore = document.getElementById('audio-core');
        const trackList = document.getElementById('track-list');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const reverseBtn = document.getElementById('reverse-btn');
        const timeline = document.getElementById('timeline');
        const timeNow = document.getElementById('time-now');
        const timeMax = document.getElementById('time-max');
        const title = document.getElementById('title');
        const volumeControl = document.getElementById('volume-control');
        const volumeIcon = document.getElementById('volume-icon');
        const debugInfo = document.getElementById('debug-info');
        
        let playlist = [];
        let currentIndex = -1;
        let isShuffle = false;
        let isRepeat = false;
        let isReversed = false;
        
        // Показать отладочную информацию
        function showDebug(message) {
            console.log(message);
            debugInfo.textContent = message;
            debugInfo.style.display = 'block';
            setTimeout(() => {
                debugInfo.style.display = 'none';
            }, 5000);
        }
        
        // Загрузка треков
        async function loadTracks() {
            if (!userId) {
                title.textContent = 'Откройте через Telegram';
                trackList.innerHTML = '<li class="loading">Пожалуйста, откройте плеер через бота в Telegram</li>';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/get-tracks?user_id=${userId}`, {
                    headers: {
                        'bypass-tunnel-reminder': 'true'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                playlist = data.tracks || [];
                
                if (playlist.length === 0) {
                    title.textContent = 'Плеер пуст';
                    trackList.innerHTML = '<li class="loading">Нет треков. Отправьте музыку боту в Telegram!</li>';
                    return;
                }
                
                updateUI();
                if (currentIndex === -1 || currentIndex >= playlist.length) {
                    changeTrack(0, false);
                }
            } catch (error) {
                console.error('Error loading tracks:', error);
                title.textContent = 'Ошибка загрузки';
                trackList.innerHTML = `<li class="error">Не удалось загрузить треки. ${error.message}</li>`;
            }
        }
        
        // Удаление трека
        async function deleteTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            
            if (!confirm(`Удалить трек «${playlist[index].name}»?`)) return;
            
            try {
                const response = await fetch(`${API_URL}/delete-track`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'bypass-tunnel-reminder': 'true'
                    },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        index: index
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    if (index === currentIndex) {
                        audioCore.pause();
                        audioCore.src = '';
                        title.textContent = 'Плеер пуст';
                        currentIndex = -1;
                    }
                    
                    playlist.splice(index, 1);
                    if (currentIndex > index) currentIndex--;
                    
                    updateUI();
                    
                    if (playlist.length > 0 && currentIndex === -1) {
                        changeTrack(0, false);
                    } else if (playlist.length === 0) {
                        trackList.innerHTML = '<li class="loading">Нет треков. Отправьте музыку боту в Telegram!</li>';
                    }
                }
            } catch (error) {
                console.error('Error deleting track:', error);
                alert('Не удалось удалить трек');
            }
        }
        
        function updateUI() {
            trackList.innerHTML = '';
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                
                const trackName = document.createElement('span');
                trackName.className = 'track-name';
                trackName.textContent = `${index + 1}. ${track.name}`;
                trackName.addEventListener('click', () => changeTrack(index));
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '🗑';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTrack(index);
                });
                
                if (index === currentIndex) li.classList.add('active');
                
                li.appendChild(trackName);
                li.appendChild(deleteBtn);
                trackList.appendChild(li);
            });
        }
        
        function changeTrack(index, autoplay = true) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            audioCore.src = playlist[index].url;
            title.textContent = playlist[index].name;
            updateUI();
            
            if (autoplay) {
                audioCore.play().catch(e => console.error('Playback error:', e));
            }
        }
        
        // Получить следующий индекс с учетом shuffle
        function getNextIndex() {
            if (isShuffle) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentIndex && playlist.length > 1);
                return randomIndex;
            }
            
            if (isReversed) {
                return currentIndex - 1 >= 0 ? currentIndex - 1 : playlist.length - 1;
            }
            
            return currentIndex + 1 < playlist.length ? currentIndex + 1 : 0;
        }
        
        // Получить предыдущий индекс с учетом shuffle
        function getPrevIndex() {
            if (isShuffle) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentIndex && playlist.length > 1);
                return randomIndex;
            }
            
            if (isReversed) {
                return currentIndex + 1 < playlist.length ? currentIndex + 1 : 0;
            }
            
            return currentIndex - 1 >= 0 ? currentIndex - 1 : playlist.length - 1;
        }
        
        // Обработчики кнопок
        playBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            if (audioCore.paused) audioCore.play();
            else audioCore.pause();
        });
        
        audioCore.addEventListener('play', () => playBtn.textContent = '⏸');
        audioCore.addEventListener('pause', () => playBtn.textContent = '▶');
        
        nextBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            changeTrack(getNextIndex());
        });
        
        prevBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            changeTrack(getPrevIndex());
        });
        
        // Shuffle
        shuffleBtn.addEventListener('click', function() {
            isShuffle = !isShuffle;
            if (isShuffle) {
                shuffleBtn.classList.add('active');
                showDebug('🔀 Случайное воспроизведение включено');
            } else {
                shuffleBtn.classList.remove('active');
                showDebug('🔀 Случайное воспроизведение выключено');
            }
        });
        
        // Repeat
        repeatBtn.addEventListener('click', function() {
            isRepeat = !isRepeat;
            audioCore.loop = isRepeat;
            if (isRepeat) {
                repeatBtn.classList.add('active');
                showDebug('🔁 Повтор включен');
            } else {
                repeatBtn.classList.remove('active');
                showDebug('🔁 Повтор выключен');
            }
        });
        
        // Reverse order
        reverseBtn.addEventListener('click', function() {
            isReversed = !isReversed;
            if (isReversed) {
                reverseBtn.classList.add('active');
                showDebug('🔄 Обратный порядок включен');
            } else {
                reverseBtn.classList.remove('active');
                showDebug('🔄 Обратный порядок выключен');
            }
        });
        
        // Обработка окончания трека
        audioCore.addEventListener('ended', function() {
            if (isRepeat) {
                // Если repeat включен, просто перезапускаем текущий трек
                audioCore.currentTime = 0;
                audioCore.play();
            } else {
                nextBtn.click();
            }
        });
        
        // Громкость
        volumeControl.addEventListener('input', function() {
            audioCore.volume = volumeControl.value / 100;
            updateVolumeIcon();
        });
        
        function updateVolumeIcon() {
            const volume = audioCore.volume;
            if (volume === 0) {
                volumeIcon.textContent = '🔇';
            } else if (volume < 0.5) {
                volumeIcon.textContent = '🔉';
            } else {
                volumeIcon.textContent = '🔊';
            }
        }
        
        // Прогресс
        audioCore.addEventListener('timeupdate', function() {
            if (!isNaN(audioCore.duration)) {
                timeline.value = (audioCore.currentTime / audioCore.duration) * 100;
                timeNow.textContent = formatTime(audioCore.currentTime);
                timeMax.textContent = formatTime(audioCore.duration);
            }
        });
        
        timeline.addEventListener('input', function() {
            if (audioCore.duration) {
                audioCore.currentTime = (timeline.value / 100) * audioCore.duration;
            }
        });
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // Установка начальной громкости
        audioCore.volume = 1.0;
        updateVolumeIcon();
        
        // Запуск
        loadTracks();
    </script>
</body>
</html>
