<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Увеличенный контейнер плеера */
        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px; /* Ширина увеличена с 340px до 480px */
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        /* Увеличенный блок трека */
        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            /* Защита от искажения: запрещаем блоку раздуваться */
            min-width: 0; 
        }

        /* Увеличенная обложка */
        .cover {
            width: 50px; /* Увеличено с 50px */
            height: 50px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0; /* Запрещаем обложке сжиматься */
        }

        /* Контейнер для текста */
        .meta {
            flex-grow: 1;
            /* Жесткое ограничение по ширине, чтобы текст уходил в троеточие */
            min-width: 0; 
        }

        /* Защита названия от длинных имен */
        .title {
            font-size: 20px; /* Увеличен шрифт */
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap; /* Текст в одну строку */
            overflow: hidden;    /* Прячем то, что не влезло */
            text-overflow: ellipsis; /* Добавляем три точки на конце */
        }

        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }

        /* Крупные кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 36px; /* Увеличен размер иконок */
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }

        /* Увеличенная полоса прогресса */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px; /* Чуть толще для удобства клика */
        }

        /* Крупная кнопка добавления */
        .upload-btn {
            display: block;
            text-align: center;
            font-size: 15px;
            color: #aaa;
            border: 2px dashed #444;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .upload-btn:hover {
            border-color: #ff55f7;
            color: #ffffffda;
        }

        input[type="file"] {
            display: none;
        }

        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Увеличенный список треков */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px; /* Списку дали больше места */
            overflow-y: auto;
        }

        .playlist li {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
            /* Защита от длинных имен внутри самого списка */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }

        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Блок трека -->
        <div class="track-info">
            <div class="cover">♫</div>
            <div class="meta">
                <p class="title" id="title">Плеер пуст</p>
                <p class="author">Musicspot</p>
            </div>
        </div>

        <!-- Скрытый аудио-движок -->
        <audio id="audio-core"></audio>

        <!-- Прогресс -->
        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <!-- Кнопка добавления -->
        <label class="upload-btn">
            + Выбрать музыку (можно много файлов)
            <input type="file" id="file-selector" accept="audio/*" multiple>
        </label>

        <!-- Очередь -->
        <div class="playlist-title">Очередь воспроизведения</div>
        <ul class="playlist" id="track-list"></ul>
    </div>

<script>
       const fileSelector = document.getElementById('file-selector');
    const audioCore = document.getElementById('audio-core');
    const trackList = document.getElementById('track-list');
    
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    
    const timeline = document.getElementById('timeline');
    const timeNow = document.getElementById('time-now');
    const timeMax = document.getElementById('time-max');
    const title = document.getElementById('title');
    const coverArt = document.getElementById('cover-art');

    let playlist = [];
    let currentIndex = 0;
    let isRewinding = false;

    // --- МАГИЯ СВЯЗИ С ТЕЛЕГРАМОМ ---
    window.addEventListener('DOMContentLoaded', () => {
        // Инициализируем Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем ТГ, что приложение загрузилось
        tg.expand(); // Разворачиваем плеер на весь экран смартфона

        // Берём ID пользователя, который открыл приложение
        const user = tg.initDataUnsafe?.user;
        
        if (user && user.id) {
            title.textContent = "Загрузка медиатеки...";
            
            // Делаем запрос к твоему запущенному Python боту (на порт 5000)
            // ВАЖНО: Вместо localhost впиши свой IP или адрес туннеля ngrok, если тестируешь с телефона!
            fetch(`http://localhost:5000/get_playlist?user_id=${user.id}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        playlist = data;
                        updateUI();
                        changeTrack(0, false); // Подгружаем первый трек из базы бота
                    } else {
                        title.textContent = "Твой плейлист пуст";
                    }
                })
                .catch(err => {
                    console.error("Ошибка сети с ботом:", err);
                    title.textContent = "Ошибка связи с ботом";
                });
        } else {
            title.textContent = "Запущено вне Telegram";
        }
    });

    // Обычный выбор файлов кнопкой (оставляем для теста на ПК)
    fileSelector.addEventListener('change', function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        const isPlaylistEmpty = playlist.length === 0;
        for (let i = 0; i < files.length; i++) {
            const fullName = files[i].name;
            const cleanName = fullName.substring(0, fullName.lastIndexOf('.')) || fullName;
            playlist.push({ name: cleanName, url: URL.createObjectURL(files[i]) });
        }
        updateUI();
        if (isPlaylistEmpty && playlist.length > 0) changeTrack(0, false);
    });

    function updateUI() {
        trackList.innerHTML = '';
        if (playlist.length === 0) return;
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            li.textContent = `${index + 1}. ${track.name}`;
            if (index === currentIndex) li.classList.add('active');
            li.addEventListener('click', () => changeTrack(index, true));
            trackList.appendChild(li);
        });
    }

    function changeTrack(index, startPlay = true) {
        if (playlist.length === 0 || index < 0 || index >= playlist.length) return;
        currentIndex = index;
        audioCore.src = playlist[index].url;
        audioCore.load();
        title.textContent = playlist[index].name;
        updateUI();
        if (startPlay) {
            audioCore.play().catch(err => console.log("Ждем клика..."));
        }
    }

    playBtn.addEventListener('click', function() {
        if (playlist.length === 0) return;
        if (audioCore.paused) {
            audioCore.play().catch(err => console.error(err));
        } else {
            audioCore.pause();
        }
    });

    audioCore.addEventListener('play', () => {
        playBtn.textContent = '⏸';
        if (coverArt) coverArt.style.animation = 'spin 4s linear infinite';
    });

    audioCore.addEventListener('pause', () => {
        playBtn.textContent = '▶';
        if (coverArt) coverArt.style.animation = 'none';
    });

    nextBtn.addEventListener('click', function() {
        if (playlist.length === 0) return;
        let nextIndex = currentIndex + 1;
        if (nextIndex >= playlist.length) nextIndex = 0;
        changeTrack(nextIndex, true);
    });

    prevBtn.addEventListener('click', function() {
        if (playlist.length === 0) return;
        let prevIndex = currentIndex - 1;
        if (prevIndex < 0) prevIndex = playlist.length - 1;
        changeTrack(prevIndex, true);
    });

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audioCore.addEventListener('loadedmetadata', () => {
        timeline.max = Math.floor(audioCore.duration);
        timeMax.textContent = formatTime(audioCore.duration);
    });

    audioCore.addEventListener('timeupdate', () => {
        if (!isRewinding) {
            timeline.value = Math.floor(audioCore.currentTime);
            timeNow.textContent = formatTime(audioCore.currentTime);
        }
    });

    timeline.addEventListener('input', () => {
        isRewinding = true;
        timeNow.textContent = formatTime(timeline.value);
    });

    timeline.addEventListener('change', () => {
        audioCore.currentTime = timeline.value;
        isRewinding = false;
    });

    audioCore.addEventListener('ended', () => { nextBtn.click(); });

</script>
</body>
</html>
