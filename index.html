<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Контейнер плеера */
        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px; 
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        /* Блок трека */
        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            min-width: 0; 
        }

        /* Обложка */
        .cover {
            width: 80px; 
            height: 80px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0; 
        }

        /* Контейнер для текста */
        .meta {
            flex-grow: 1;
            min-width: 0; 
        }

        /* Название трека */
        .title {
            font-size: 20px; 
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap; 
            overflow: hidden;    
            text-overflow: ellipsis; 
        }

        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }

        /* Кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 36px; 
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }

        /* Полоса прогресса */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px; 
        }

        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Список треков */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px; 
            overflow-y: auto;
        }

        .playlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
        }

        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }

        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }

        .track-name-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            margin-right: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Блок трека -->
        <div class="track-info">
            <div class="cover">♫</div>
            <div class="meta">
                <p class="title" id="title">Загрузка...</p>
                <p class="author">Telegram Cloud</p>
            </div>
        </div>

        <!-- Аудио-движок -->
        <audio id="audio-core"></audio>

        <!-- Прогресс -->
        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <!-- Очередь -->
        <div class="playlist-title">Очередь воспроизведения</div>
        <ul class="playlist" id="track-list"></ul>
    </div>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const audioCore = document.getElementById('audio-core');
    const trackList = document.getElementById('track-list');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const timeline = document.getElementById('timeline');
    const timeNow = document.getElementById('time-now');
    const timeMax = document.getElementById('time-max');
    const title = document.getElementById('title');

    let playlist = [];
    let currentIndex = 0;

    // Безопасный разбор треков из адресной строки
    function loadPlaylistFromUrl() {
        const searchSource = window.location.search || window.location.hash.substring(window.location.hash.indexOf('?'));
        const urlParams = new URLSearchParams(searchSource);
        const tracksParam = urlParams.get('tracks');
        
        if (tracksParam) {
            try {
                const decodedData = decodeURIComponent(decodeURIComponent(tracksParam));
                const parsed = JSON.parse(decodedData);
                
                if (Array.isArray(parsed)) {
                    playlist = parsed.map(track => {
                        let nameVal = track.name;
                        if (Array.isArray(nameVal)) {
                            nameVal = nameVal[0];
                        }
                        return {
                            name: String(nameVal || "Без названия"),
                            url: String(track.url || "")
                        };
                    });
                }
                
                if (playlist.length > 0) {
                    updateUI();
                    initTrack(0);
                } else {
                    title.textContent = "В плейлисте нет треков";
                }
            } catch (e) {
                console.error("Ошибка парсинга:", e);
                title.textContent = "Ошибка чтения данных";
            }
        } else {
            title.textContent = "Плейлист пуст. Скиньте MP3 боту!";
        }
    }

    function updateUI() {
        trackList.innerHTML = '';
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');

            const textSpan = document.createElement('span');
            textSpan.className = 'track-name-text';
            textSpan.textContent = `${index + 1}. ${track.name}`;
            textSpan.addEventListener('click', () => changeTrack(index));
            li.appendChild(textSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '🗑';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                deleteTrack(index);
            });
            li.appendChild(delBtn);

            trackList.appendChild(li);
        });
    }

    function initTrack(index) {
        if (index < 0 || index >= playlist.length) return;
        currentIndex = index;
        audioCore.src = playlist[index].url;
        title.textContent = playlist[index].name;
    }

    function changeTrack(index) {
        initTrack(index);
        updateUI();
        audioCore.play().catch(err => console.log("Ожидание действия пользователя"));
    }

    function deleteTrack(index) {
        if (confirm(`Удалить трек "${playlist[index].name}"?`)) {
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: "delete",
                    index: index
                }));
                tg.close();
            }
        }
    }

    // --- УПРАВЛЕНИЕ УСТРОЙСТВОМ ---
    playBtn.addEventListener('click', function() {
        if (playlist.length === 0) return;
        if (audioCore.paused) {
            audioCore.play().catch(e => alert("Ошибка запуска трека. Проверьте, запущен ли bot.py!"));
        } else {
            audioCore.pause();
        }
    });

    audioCore.addEventListener('play', () => playBtn.textContent = '⏸');
    audioCore.addEventListener('pause', () => playBtn.textContent = '▶');

    nextBtn.addEventListener('click', () => {
        if (playlist.length === 0) return;
        let nextIndex = currentIndex + 1;
        if (nextIndex >= playlist.length) nextIndex = 0;
        changeTrack(nextIndex);
    });

    prevBtn.addEventListener('click', () => {
        if (playlist.length === 0) return;
        let prevIndex = currentIndex - 1;
        if (prevIndex < 0) prevIndex = playlist.length - 1;
        changeTrack(prevIndex);
    });
    
    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return ${mins}:${secs < 10 ? '0' : ''}${secs};
        }
    audioCore.addEventListener('timeupdate', () => {
        if (!audioCore.duration) return;
        timeline.value = (audioCore.currentTime / audioCore.duration) * 100;
        timeNow.textContent = formatTime(audioCore.currentTime);
    });

    audioCore.addEventListener('loadedmetadata', () => {
        timeMax.textContent = formatTime(audioCore.duration);
    });

    timeline.addEventListener('input', () => {
        if (!audioCore.duration) return;
        audioCore.currentTime = (timeline.value / 100) * audioCore.duration;
    });

    audioCore.addEventListener('ended', () => nextBtn.click());

    loadPlaylistFromUrl();

    </script>
</body>
</html>
