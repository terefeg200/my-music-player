<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px; 
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            min-width: 0; 
        }
        .cover {
            width: 80px; 
            height: 80px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0; 
        }
        .meta {
            flex-grow: 1;
            min-width: 0; 
        }
        .title {
            font-size: 20px; 
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap; 
            overflow: hidden;    
            text-overflow: ellipsis; 
        }
        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 24px;
        }
        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 36px; 
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }
        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }
        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px; 
        }
        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px; 
            overflow-y: auto;
        }
        .playlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
        }
        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }
        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }
        .track-name-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            margin-right: 10px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="track-info">
            <div class="cover">♫</div>
            <div class="meta">
                <p class="title" id="title">Загрузка плейлиста...</p>
                <p class="author">Telegram Cloud</p>
            </div>
        </div>

        <audio id="audio-core"></audio>

        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <div class="playlist-title">Очередь воспроизведения</div>
        <ul class="playlist" id="track-list"></ul>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const audioCore = document.getElementById('audio-core');
    const trackList = document.getElementById('track-list');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const timeline = document.getElementById('timeline');
    const timeNow = document.getElementById('time-now');
    const timeMax = document.getElementById('time-max');
    const title = document.getElementById('title');

    let playlist = [];
    let currentIndex = 0;

    // ВНИМАНИЕ: Замените на вашу ссылку от ngrok или http://localhost:8000 если проверяете на ПК в Telegram Desktop
    const SERVER_URL = "http://localhost:8000"; 

    // Загрузка треков напрямую с вашего сервера по API
    async function loadTracksFromServer() {
        // Достаем ID пользователя из Telegram SDK
        const userId = tg?.initDataUnsafe?.user?.id || 0;
        
        if (!userId) {
            title.textContent = "Запустите через Telegram чат!";
            return;
        }

        try {
            const response = await fetch(`${SERVER_URL}/get-tracks?user_id=${userId}`);
            const data = await response.json();
            
            playlist = data.tracks || [];
            
            if (playlist.length > 0) {
                updateUI();
                initTrack(0);
            } else {
                title.textContent = "Скиньте MP3 боту!";
            }
        } catch (e) {
            console.error(e);
            title.textContent = "Ошибка сети с сервером";
        }
    }

    function updateUI() {
        trackList.innerHTML = '';
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');

            const textSpan = document.createElement('span');
            textSpan.className = 'track-name-text';
            textSpan.textContent = `${index + 1}. ${track.name}`;
            textSpan.addEventListener('click', () => changeTrack(index));
            li.appendChild(textSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '🗑';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                deleteTrack(index);
            });
            li.appendChild(delBtn);

            trackList.appendChild(li);
        });
    }

    function initTrack(index) {
        if (index < 0 || index >= playlist.length) return;
        currentIndex = index;
        audioCore.src = playlist[index].url;
        title.textContent = playlist[index].name;
    }

    function changeTrack(index) {
        initTrack(index);
        updateUI();
        audioCore.play().catch(err => console.log("Ожидание клика"));
    }

    async function deleteTrack(index) {
        const userId = tg?.initDataUnsafe?.user?.id || 0;
        if (confirm(`Удалить трек "${playlist[index].name}"?`)) {
            try {
                await fetch(`${SERVER_URL}/delete-track`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, index: index })
                });
                loadTracksFromServer(); // Перезагружаем список
            } catch (e) {
                alert("Не удалось удалить трек");
            }
        }
    }

    playBtn.addEventListener('click', function() {
        if (playlist.length === 0) return;
        if (audioCore.paused) {
            audioCore.play().catch(e => alert("Ошибка запуска файла. Проверьте сервер."));
        } else {
            audioCore.pause();
        }
    });

    audioCore.addEventListener('play', () => playBtn.textContent = '⏸');
    audioCore.addEventListener('pause', () => playBtn.textContent = '▶');

    nextBtn.addEventListener('click', () => {
        if (playlist.length === 0) return;
        let nextIndex = currentIndex + 1;
        if (nextIndex >= playlist.length) nextIndex = 0;
        changeTrack(nextIndex);
    });

    prevBtn.addEventListener('click', () => {
        if (playlist.length === 0) return;
        let prevIndex = currentIndex - 1;
        if (prevIndex < 0) prevIndex = playlist.length - 1;
        changeTrack(prevIndex);
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audioCore.addEventListener('timeupdate', () => {
        if (!audioCore.duration) return;
        timeline.value = (audioCore.currentTime / audioCore.duration) * 100;
        timeNow.textContent = formatTime(audioCore.currentTime);
    });

    audioCore.addEventListener('loadedmetadata', () => {
        timeMax.textContent = formatTime(audioCore.duration);
    });

    timeline.addEventListener('input', () => {\
        if (!audioCore.duration) return;
        audioCore.currentTime = (timeline.value / 100) * audioCore.duration;
    });

    audioCore.addEventListener('ended', () => nextBtn.click());

    loadTracksFromServer();

    </script>
</body>
</html>
