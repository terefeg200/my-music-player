<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Увеличенный контейнер плеера */
        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px; /* Ширина увеличена с 340px до 480px */
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        /* Увеличенный блок трека */
        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            /* Защита от искажения: запрещаем блоку раздуваться */
            min-width: 0; 
        }

        /* Увеличенная обложка */
        .cover {
            width: 50px; /* Увеличено с 50px */
            height: 50px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0; /* Запрещаем обложке сжиматься */
        }

        /* Контейнер для текста */
        .meta {
            flex-grow: 1;
            /* Жесткое ограничение по ширине, чтобы текст уходил в троеточие */
            min-width: 0; 
        }

        /* Защита названия от длинных имен */
        .title {
            font-size: 20px; /* Увеличен шрифт */
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap; /* Текст в одну строку */
            overflow: hidden;    /* Прячем то, что не влезло */
            text-overflow: ellipsis; /* Добавляем три точки на конце */
        }

        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }

        /* Крупные кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 36px; /* Увеличен размер иконок */
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }

        /* Увеличенная полоса прогресса */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px; /* Чуть толще для удобства клика */
        }

        /* Крупная кнопка добавления */
        .upload-btn {
            display: block;
            text-align: center;
            font-size: 15px;
            color: #aaa;
            border: 2px dashed #444;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .upload-btn:hover {
            border-color: #ff55f7;
            color: #ffffffda;
        }

        input[type="file"] {
            display: none;
        }

        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Увеличенный список треков */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px; /* Списку дали больше места */
            overflow-y: auto;
        }

        .playlist li {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
            /* Защита от длинных имен внутри самого списка */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }

        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Блок трека -->
        <div class="track-info">
            <div class="cover">♫</div>
            <div class="meta">
                <p class="title" id="title">Плеер пуст</p>
                <p class="author">Musicspot</p>
            </div>
        </div>

        <!-- Скрытый аудио-движок -->
        <audio id="audio-core"></audio>

        <!-- Прогресс -->
        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <!-- Кнопка добавления -->
        <label class="upload-btn">
            + Выбрать музыку (можно много файлов)
            <input type="file" id="file-selector" accept="audio/*" multiple>
        </label>

        <!-- Очередь -->
        <div class="playlist-title">Очередь воспроизведения</div>
        <ul class="playlist" id="track-list"></ul>
    </div>

<script>
    const fileSelector = document.getElementById('file-selector');
    const audioCore = document.getElementById('audio-core');
    const trackList = document.getElementById('track-list');
    
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    
    const timeline = document.getElementById('timeline');
    const timeNow = document.getElementById('time-now');
    const timeMax = document.getElementById('time-max');
    const title = document.getElementById('title');
    const coverArt = document.getElementById('cover-art');

    let playlist = [];
    let currentIndex = 0;
    let isRewinding = false;

       // НАДЕЖНЫЙ ВАРИАНТ ПЕРЕХВАТА ТРЕКОВ БЕЗ ОШИБОК:
        window.addEventListener('DOMContentLoaded', () => {
        let userId = null;

        // 1. Подключаем Telegram API и вытаскиваем ID пользователя
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            
            const user = window.Telegram.WebApp.initDataUnsafe?.user;
            if (user && user.id) {
                userId = user.id;
            }
        }

        // Если запустили внутри ТГ и получили ID
        if (userId) {
            title.textContent = "Загрузка медиатеки...";
            
            // 2. Делаем прямой запрос к твоему Python-серверу на ПК
            fetch(`http://localhost:8000/get-playlist?user_id=${userId}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        playlist = data;
                        updateUI();
                        changeTrack(0, false); // Подгружаем первый трек, но не играем сразу
                    } else {
                        title.textContent = "Твой плейлист пуст";
                    }
                })
                .catch(err => {
                    console.error("Ошибка сети с ботом:", err);
                    title.textContent = "Ошибка связи с ПК";
                });
        } else {
            title.textContent = "Запущено вне Telegram";
        }
    });


        const urlParams = new URLSearchParams(window.location.search);
        const tracksParam = urlParams.get('tracks');

        if (tracksParam) {
            try {
                const decodedData = decodeURIComponent(tracksParam);
                const incomingTracks = JSON.parse(decodedData);
                
                if (incomingTracks && incomingTracks.length > 0) {
                    // Очищаем массив: берем ТОЛЬКО имя и ссылку, отбрасывая мусор
                    playlist = incomingTracks.map(track => ({
                        name: track.name,
                        url: track.url
                    }));
                    
                    updateUI();
                    changeTrack(0, false); // Подгружаем первый трек, но не включаем сам
                } else {
                    title.textContent = "Очередь пуста";
                }
            } catch (e) {
                console.error("Ошибка разбора треков:", e);
                title.textContent = "Ошибка загрузки списка";
            }
        } else {
            title.textContent = "Плеер пуст";
        }
    });


        // Выводим параметры на экран, чтобы увидеть, что прислал бот
        title.textContent = "Строка: " + window.location.search;

        const urlParams = new URLSearchParams(window.location.search);
        const tracksParam = urlParams.get('tracks');

        if (tracksParam) {
            try {
                const decodedData = decodeURIComponent(tracksParam);
                const incomingTracks = JSON.parse(decodedData);
                
                if (incomingTracks && incomingTracks.length > 0) {
                    playlist = incomingTracks;
                    updateUI();
                    changeTrack(0, false); 
                } else {
                    title.textContent = "Массив в JSON пуст";
                }
            } catch (e) {
                title.textContent = "Сбой JSON: " + e.message;
            }
        }
    });


        // Читаем параметры адресной строки
        const urlParams = new URLSearchParams(window.location.search);
        const tracksParam = urlParams.get('tracks');

        if (tracksParam) {
            try {
                // Раскодируем JSON, который прислал бот
                const decodedData = decodeURIComponent(tracksParam);
                const incomingTracks = JSON.parse(decodedData);
                
                if (incomingTracks && incomingTracks.length > 0) {
                    playlist = incomingTracks;
                    updateUI();
                        function updateUI() {
        trackList.innerHTML = '';
        if (playlist.length === 0) {
            title.textContent = "Плеер пуст";
            return;
        }

        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.style.alignItems = 'center';

            // Текст названия трека
            const textSpan = document.createElement('span');
            textSpan.textContent = `${index + 1}. ${track.name}`;
            textSpan.style.flexGrow = '1';
            textSpan.style.overflow = 'hidden';
            textSpan.style.textOverflow = 'ellipsis';
            textSpan.addEventListener('click', () => changeTrack(index, true));

            // Кнопка удаления (крестик)
            const deleteBtn = document.createElement('span');
            deleteBtn.textContent = '❌';
            deleteBtn.style.cursor = 'pointer';
            deleteBtn.style.padding = '0 5px';
            deleteBtn.style.fontSize = '12px';
            
            // Логика клика по крестику
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Запрещаем треку включаться при удалении
                
                // Удаляем элемент из массива JavaScript сайта
                playlist.splice(index, 1);
                
                // Если удалили трек, который сейчас играет
                if (index === currentIndex) {
                    audioCore.pause();
                    audioCore.src = '';
                    title.textContent = "Плеер пуст";
                } else if (index < currentIndex) {
                    currentIndex--; // Сдвигаем индекс активного трека назад
                }

                updateUI(); // Перерисовываем список на экране

</script>
</body>
</html>
