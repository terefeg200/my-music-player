<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); 

    const audioCore = document.getElementById('audio-core');
    const trackList = document.getElementById('track-list');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const timeline = document.getElementById('timeline');
    const timeNow = document.getElementById('time-now');
    const timeMax = document.getElementById('time-max');
    const title = document.getElementById('title');

    let playlist = [];
    let currentIndex = 0;

    // Улучшенный парсинг треков из URL
    function loadPlaylistFromUrl() {
        const searchSource = window.location.search || window.location.hash.substring(window.location.hash.indexOf('?'));
        const urlParams = new URLSearchParams(searchSource);
        const tracksParam = urlParams.get('tracks');
        
        if (tracksParam) {
            try {
                const decodedData = decodeURIComponent(decodeURIComponent(tracksParam));
                const parsed = JSON.parse(decodedData);
                
                if (Array.isArray(parsed)) {
                    // Исправление на лету: если имя трека прилетело массивом, превращаем его в строку
                    playlist = parsed.map(track => ({
                        name: Array.isArray(track.name) ? track.name[0] : track.name,
                        url: track.url
                    }));
                }
                
                if (playlist.length > 0) {
                    updateUI();
                    initTrack(0);
                } else {
                    title.textContent = "В плейлисте нет треков";
                }
            } catch (e) {
                console.error("Ошибка парсинга:", e);
                title.textContent = "Ошибка структуры данных";
            }
        } else {
            title.textContent = "Плейлист пуст. Скиньте MP3 боту!";
        }
    }

    function updateUI() {
        trackList.innerHTML = '';
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');

            const textSpan = document.createElement('span');
            textSpan.className = 'track-name-text';
            textSpan.textContent = `${index + 1}. ${track.name}`;
            textSpan.addEventListener('click', () => changeTrack(index));
            li.appendChild(textSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '🗑';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                deleteTrack(index);
            });
            li.appendChild(delBtn);

            trackList.appendChild(li);
        });
    }

    function initTrack(index) {
        if (index < 0 || index >= playlist.length) return;
        currentIndex = index;
        audioCore.src = playlist[index].url;
        title.textContent = playlist[index].name;
    }

    function changeTrack(index) {
        initTrack(index);
        updateUI();
        audioCore.play().catch(err => console.log("Требуется нажатие Play"));
    }

    function deleteTrack(index) {
        if (confirm(`Удалить трек "${playlist[index].name}"?`)) {
            tg.sendData(JSON.stringify({
                action: "delete",
                index: index
            }));
            tg.close(); 
        }
    }

    // --- УПРАВЛЕНИЕ ---
    playBtn.addEventListener('click', function() {
        if (playlist.length === 0) return;
        if (audioCore.paused) {
            audioCore.play().catch(e => alert("Ошибка воспроизведения. Убедитесь, что bot.py запущен."));
        } else {
            audioCore.pause();
        }
    });

    audioCore.addEventListener('play', () => playBtn.textContent = '⏸');
    audioCore.addEventListener('pause', () => playBtn.textContent = '▶');

    nextBtn.addEventListener('click', () => {
        if (playlist.length === 0) return;
        let nextIndex = currentIndex + 1;
        if (nextIndex >= playlist.length) nextIndex = 0;
        changeTrack(nextIndex);
    });

    prevBtn.addEventListener('click', () => {
        if (playlist.length === 0) return;
        let prevIndex = currentIndex - 1;
        if (prevIndex < 0) prevIndex = playlist.length - 1;
        changeTrack(prevIndex);
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audioCore.addEventListener('timeupdate', () => {
        if (!audioCore.duration) return;
        timeline.value = (audioCore.currentTime / audioCore.duration) * 100;
        timeNow.textContent = formatTime(audioCore.currentTime);
    });

    audioCore.addEventListener('loadedmetadata', () => {
        timeMax.textContent = formatTime(audioCore.duration);
    });

    timeline.addEventListener('input', () => {
        if (!audioCore.duration) return;
        audioCore.currentTime = (timeline.value / 100) * audioCore.duration;
    });

    audioCore.addEventListener('ended', () => nextBtn.click());

    // Запуск парсинга
    loadPlaylistFromUrl();
</script>
