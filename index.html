<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <!-- Подключаем официальный скрипт Telegram API -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px; 
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            min-width: 0; 
        }

        .cover {
            width: 80px; 
            height: 80px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0; 
        }

        .meta {
            flex-grow: 1;
            min-width: 0; 
        }

        .title {
            font-size: 20px; 
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap; 
            overflow: hidden;    
            text-overflow: ellipsis; 
        }

        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 36px; 
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px; 
        }

        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px; 
            overflow-y: auto;
        }

        .playlist li {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }

        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Блок трека -->
        <div class="track-info">
            <div class="cover" id="cover-art">♫</div>
            <div class="meta">
                <p class="title" id="title">Плеер пуст</p>
                <p class="author">Musicspot</p>
            </div>
        </div>

        <!-- Скрытый аудио-движок -->
        <audio id="audio-core"></audio>

        <!-- Прогресс -->
        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <!-- Очередь воспроизведения -->
        <div class="playlist-title">Очередь воспроизведения</div>
        <ul class="playlist" id="track-list"></ul>
    </div>

<script>
    const audioCore = document.getElementById('audio-core');
    const trackList = document.getElementById('track-list');
    
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    
    const timeline = document.getElementById('timeline');
    const timeNow = document.getElementById('time-now');
    const timeMax = document.getElementById('time-max');
    const title = document.getElementById('title');
    const coverArt = document.getElementById('cover-art');

    let playlist = [];
    let currentIndex = 0;
    let isRewinding = false;

    // Автоматическая загрузка треков с ПК при старте
    window.addEventListener('DOMContentLoaded', () => {
        let userId = null;

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            
            // Получаем данные пользователя Telegram
            const user = window.Telegram.WebApp.initDataUnsafe?.user;
            if (user && user.id) {
                userId = user.id;
            }
        }

        if (userId) {
            title.textContent = "Загрузка медиатеки...";
            
            // Скачиваем актуальный плейлист с твоего запущенного бота на ПК
            fetch(`http://localhost:8000/get-playlist?user_id=${userId}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        playlist = data;
                        updateUI();
                        changeTrack(0, false); // Подгружаем первый трек в плеер
                    } else {
                        title.textContent = "Плейлист пуст";
                    }
                })
                .catch(err => {
                    console.error("Ошибка связи с ботом:", err);
                    title.textContent = "Ошибка связи с ПК";
                });
        } else {
            title.textContent = "Запустите бота в Telegram";
        }
    });

    // Функция обновления списка на экране + кнопки удаления
    function updateUI() {
        trackList.innerHTML = '';
        if (playlist.length === 0) {
            title.textContent = "Плеер пуст";
            return;
        }

        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.style.alignItems = 'center';

            const textSpan = document.createElement('span');
            textSpan.textContent = `${index + 1}. ${track.name}`;
            textSpan.style.flexGrow = '1';
            textSpan.style.overflow = 'hidden';
            textSpan.style.textOverflow = 'ellipsis';
            textSpan.addEventListener('click', () => changeTrack(index, true));

            const deleteBtn = document.createElement('span');
            deleteBtn.textContent = '❌';
            deleteBtn.style.cursor = 'pointer';
            deleteBtn.style.padding = '0 5px';
            deleteBtn.style.fontSize = '12px';
            
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Запрещаем треку играть при клике на крестик
                
                // Шлем сигнал боту, чтобы стёр трек у себя
                if (window.Telegram && window.Telegram.WebApp) {
                    const dataToSend = { action: "delete", index: index };
                    window.Telegram.WebApp.sendData(JSON.stringify(dataToSend));
                }

                playlist.splice(index, 1);
                if (index === currentIndex) {
                    audioCore.pause();
                    audioCore.src = '';
                    title.textContent = "Плеер пуст";
                } else if (index < currentIndex) {
                    currentIndex--;
                }
                updateUI();
            });

            if (index === currentIndex) {
                li.classList.add('active');
            }

            li.appendChild(textSpan);
            li.appendChild(deleteBtn);
            trackList.appendChild(li);
        });
    }

    // Смена песни
    function changeTrack(index, startPlay = true) {
        if (playlist.length === 0 || index < 0 || index >= playlist.length) return;
        currentIndex = index;
        audioCore.src = playlist[index].url;
        audioCore.load();
        title.textContent = playlist[index].name;
        updateUI();
        if (startPlay) {
            audioCore.play().catch(err => console.log("Ожидание запуска пользователем"));
        }
    }

    // Управление воспроизведением
    playBtn.addEventListener('click', function() {
        if (playlist.length === 0) return;
        if (audioCore.paused) {
            audioCore.play().catch(err => console.error(err));
        } else {
            audioCore.pause();
        }
    });

    audioCore.addEventListener('play', () => {
    playBtn.textContent = '⏸';
    if (coverArt) coverArt.style.animation = 'spin 4s linear infinite'
    });

    audioCore.addEventListener('pause', () => {
    playBtn.textContent = '▶';
    if (coverArt) coverArt.style.animation = 'none';
    });

    nextBtn.addEventListener('click', function() {
    if (playlist.length === 0) return;
    let nextIndex = currentIndex + 1;
    if (nextIndex >= playlist.length) nextIndex = 0;
    changeTrack(nextIndex, true);
    });

   prevBtn.addEventListener('click', function() {
    if (playlist.length === 0) return;
    let prevIndex = currentIndex - 1;
    if (prevIndex < 0) prevIndex = playlist.length - 1;
    changeTrack(prevIndex, true);
    });

    function formatTime(seconds) {
    if (isNaN(seconds) || seconds === Infinity) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return ${mins}:${secs < 10 ? '0' : ''}${secs};
    }

    audioCore.addEventListener('loadedmetadata', () => {
    timeline.max = Math.floor(audioCore.duration);
    timeMax.textContent = formatTime(audioCore.duration);
    });

    audioCore.addEventListener('timeupdate', () => {
    if (!isRewinding) {timeline.value = Math.floor(audioCore.currentTime);
    timeNow.textContent = formatTime(audioCore.currentTime);
    }
    });

    timeline.addEventListener('input', () => {
    isRewinding = true;
    timeNow.textContent = formatTime(timeline.value);
    });

    timeline.addEventListener('change', () => {
    audioCore.currentTime = timeline.value;
    isRewinding = false;
    });
    audioCore.addEventListener('ended', () => { 
    nextBtn.click(); 
    });
