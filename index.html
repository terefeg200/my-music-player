<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            min-width: 0;
        }

        .cover {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0;
        }

        .meta {
            flex-grow: 1;
            min-width: 0;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 36px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px;
        }

        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }

        .playlist li {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }

        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }

        .track-name {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #ff5555;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- Блок трека -->
        <div class="track-info">
            <div class="cover">♫</div>
            <div class="meta">
                <p class="title" id="title">Загрузка...</p>
                <p class="author">Musicspot</p>
            </div>
        </div>

        <!-- Скрытый аудио-движок -->
        <audio id="audio-core"></audio>

        <!-- Прогресс -->
        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <!-- Очередь -->
        <div class="playlist-title">Очередь воспроизведения (нажмите 🗑 для удаления)</div>
        <ul class="playlist" id="track-list">
            <li class="loading">Загрузка треков...</li>
        </ul>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        
        const API_URL = 'http://localhost:8000';
        
        const audioCore = document.getElementById('audio-core');
        const trackList = document.getElementById('track-list');
        
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const timeline = document.getElementById('timeline');
        const timeNow = document.getElementById('time-now');
        const timeMax = document.getElementById('time-max');
        const title = document.getElementById('title');

        let playlist = [];
        let currentIndex = -1;

        // Загрузка треков с сервера
        async function loadTracks() {
            if (!userId) {
                title.textContent = 'Ошибка: нет user_id';
                trackList.innerHTML = '<li class="error">Не удалось определить пользователя</li>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/get-tracks?user_id=${userId}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                playlist = data.tracks || [];
                
                if (playlist.length === 0) {
                    title.textContent = 'Плеер пуст';
                    trackList.innerHTML = '<li class="loading">Нет треков. Отправьте музыку боту в Telegram!</li>';
                    return;
                }
                
                updateUI();
                if (currentIndex === -1 || currentIndex >= playlist.length) {
                    changeTrack(0, false);
                }
            } catch (error) {
                console.error('Error loading tracks:', error);
                title.textContent = 'Ошибка загрузки';
                trackList.innerHTML = '<li class="error">Не удалось загрузить треки. Проверьте, запущен ли сервер.</li>';
            }
        }

        // Удаление трека
        async function deleteTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            
            if (!confirm(`Удалить трек «${playlist[index].name}»?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/delete-track`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        index: index
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Останавливаем воспроизведение, если удаляем текущий трек
                    if (index === currentIndex) {
                        audioCore.pause();
                        audioCore.src = '';
                        title.textContent = 'Плеер пуст';
                        currentIndex = -1;
                    }
                    
                    // Удаляем трек из локального плейлиста
                    playlist.splice(index, 1);
                    
                    // Обновляем текущий индекс, если нужно
                    if (currentIndex > index) {
                        currentIndex--;
                    }
                    
                    updateUI();
                    
                    // Если есть треки и плеер пуст, начинаем с первого
                    if (playlist.length > 0 && currentIndex === -1) {
                        changeTrack(0, false);
                    } else if (playlist.length === 0) {
                        trackList.innerHTML = '<li class="loading">Нет треков. Отправьте музыку боту в Telegram!</li>';
                    }
                } else {
                    alert('Ошибка при удалении трека');
                }
            } catch (error) {
                console.error('Error deleting track:', error);
                alert('Не удалось удалить трек. Проверьте соединение с сервером.');
            }
        }

        function updateUI() {
            trackList.innerHTML = '';
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                
                const trackName = document.createElement('span');
                trackName.className = 'track-name';
                trackName.textContent = `${index + 1}. ${track.name}`;
                trackName.addEventListener('click', () => changeTrack(index));
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '🗑';
                deleteBtn.title = 'Удалить трек';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTrack(index);
                });
                
                if (index === currentIndex) {
                    li.classList.add('active');
                }
                
                li.appendChild(trackName);
                li.appendChild(deleteBtn);
                trackList.appendChild(li);
            });
        }

        function changeTrack(index, autoplay = true) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            audioCore.src = playlist[index].url;
            title.textContent = playlist[index].name;
            updateUI();
            
            if (autoplay) {
                audioCore.play().catch(e => {
                    console.error('Playback error:', e);
                });
            }
        }

        playBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            if (audioCore.paused) {
                audioCore.play();
            } else {
                audioCore.pause();
            }
        });

        audioCore.addEventListener('play', () => playBtn.textContent = '⏸');
        audioCore.addEventListener('pause', () => playBtn.textContent = '▶');

        nextBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            let nextIndex = currentIndex + 1 < playlist.length ? currentIndex + 1 : 0;
            changeTrack(nextIndex);
        });

        prevBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            let prevIndex = currentIndex - 1 >= 0 ? currentIndex - 1 : playlist.length - 1;
            changeTrack(prevIndex);
        });

        audioCore.addEventListener('ended', function() {
            nextBtn.click();
        });

        audioCore.addEventListener('timeupdate', function() {
            if (!isNaN(audioCore.duration)) {
                const progressPct = (audioCore.currentTime / audioCore.duration) * 100;
                timeline.value = progressPct;
                timeNow.textContent = formatTime(audioCore.currentTime);
                timeMax.textContent = formatTime(audioCore.duration);
            }
        });

        timeline.addEventListener('input', function() {
            if (audioCore.duration) {
                audioCore.currentTime = (timeline.value / 100) * audioCore.duration;
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        // Загружаем треки при старте
        loadTracks();
    </script>
</body>
</html>
