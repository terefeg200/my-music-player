<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Макси</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030303;
            color: #ffffffd7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Увеличенный контейнер плеера */
        .player-container {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            width: 480px; /* Ширина увеличена с 340px до 480px */
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        /* Увеличенный блок трека */
        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            /* Защита от искажения: запрещаем блоку раздуваться */
            min-width: 0; 
        }

        /* Увеличенная обложка */
        .cover {
            width: 50px; /* Увеличено с 50px */
            height: 50px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #fa6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f267ff;
            flex-shrink: 0; /* Запрещаем обложке сжиматься */
        }

        /* Контейнер для текста */
        .meta {
            flex-grow: 1;
            /* Жесткое ограничение по ширине, чтобы текст уходил в троеточие */
            min-width: 0; 
        }

        /* Защита названия от длинных имен */
        .title {
            font-size: 20px; /* Увеличен шрифт */
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap; /* Текст в одну строку */
            overflow: hidden;    /* Прячем то, что не влезло */
            text-overflow: ellipsis; /* Добавляем три точки на конце */
        }

        .author {
            font-size: 14px;
            color: #aaa;
            margin: 0;
        }

        /* Крупные кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffffdc;
            font-size: 36px; /* Увеличен размер иконок */
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.1);
            color: #ff6df8;
        }

        /* Увеличенная полоса прогресса */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .progress-bar {
            flex-grow: 1;
            cursor: pointer;
            height: 6px; /* Чуть толще для удобства клика */
        }

        /* Крупная кнопка добавления */
        .upload-btn {
            display: block;
            text-align: center;
            font-size: 15px;
            color: #aaa;
            border: 2px dashed #444;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .upload-btn:hover {
            border-color: #ff55f7;
            color: #ffffffda;
        }

        input[type="file"] {
            display: none;
        }

        .playlist-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Увеличенный список треков */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px; /* Списку дали больше места */
            overflow-y: auto;
        }

        .playlist li {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #aaa;
            /* Защита от длинных имен внутри самого списка */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist li:hover {
            background: #222;
            color: #ffffffb4;
        }

        .playlist li.active {
            color: #ff48ff;
            background: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Блок трека -->
        <div class="track-info">
            <div class="cover">♫</div>
            <div class="meta">
                <p class="title" id="title">Плеер пуст</p>
                <p class="author">Musicspot</p>
            </div>
        </div>

        <!-- Скрытый аудио-движок -->
        <audio id="audio-core"></audio>

        <!-- Прогресс -->
        <div class="progress-container">
            <span id="time-now">0:00</span>
            <input type="range" class="progress-bar" id="timeline" value="0" min="0" max="100">
            <span id="time-max">0:00</span>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn" id="play-btn" style="font-size: 46px;">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <!-- Кнопка добавления -->
        <label class="upload-btn">
            + Выбрать музыку (можно много файлов)
            <input type="file" id="file-selector" accept="audio/*" multiple>
        </label>

        <!-- Очередь -->
        <div class="playlist-title">Очередь воспроизведения</div>
        <ul class="playlist" id="track-list"></ul>
    </div>

<script>
    // Автоматическая загрузка трека из ссылки от бота при старте
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const trackUrl = urlParams.get('track');
    const trackName = urlParams.get('name') || "Трек из Telegram";

    if (trackUrl) {
        // Добавляем трек от бота в начало плейлиста
        playlist.push({
            name: decodeURIComponent(trackName),
            url: trackUrl
        });
        updateUI();
        changeTrack(0, true); // Сразу запускаем
    }
});
</script>
</body>
</html>
